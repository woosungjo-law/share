<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>리스크레이더 디자인 후보 B — 조치보드</title>
<style>
:root{--bg:#fbfaf7;--panel:#fff;--ink:#222b31;--muted:#6f777b;--line:#e6e3dc;--blue:#2b6574;--red:#c93e36;--amber:#d1871d;--green:#37835a;--redbg:#fff2f0;--amberbg:#fff7e9;--greenbg:#eef8f0;--shadow:0 10px 28px rgba(65,55,31,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}h1{margin:6px 0 0;font-size:28px;letter-spacing:-.05em}.meta{font-size:12px;color:var(--muted);text-align:right}.summary{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin:22px 0 16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}.stat label{font-size:11px;color:var(--muted);display:block}.stat b{font-size:24px}.stat strong{color:var(--red);font-size:12px;margin-left:6px}.lead{display:flex;align-items:center;gap:12px;background:#eaf2f2;border:1px solid #c9dedf;border-radius:12px;padding:13px 16px;color:#235664;margin-bottom:18px}.lead b{font-size:13px}.lead span{font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}.section-head h2{font-size:15px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.filters button{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}.filters button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.filters input{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:12px;width:210px}.action-card{display:grid;grid-template-columns:150px 1fr 185px;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:12px;padding:15px 16px;margin:9px 0;box-shadow:0 4px 13px rgba(65,55,31,.04);cursor:pointer;transition:.18s}.action-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.action-card.high{border-left-color:var(--red)}.action-card.low{border-left-color:var(--green)}.when{font-size:12px;font-weight:800;color:var(--amber)}.high .when{color:var(--red)}.low .when{color:var(--green)}.when b{display:block;font-size:16px;color:var(--ink);margin-top:3px}.action-card h3{margin:0;font-size:15px}.action-card p{margin:4px 0 0;color:var(--muted);font-size:12px}.next{font-size:12px;color:var(--blue);font-weight:800}.next:before{content:'다음 ';color:var(--muted);font-weight:500}.empty{display:none;background:#fff;padding:24px;border:1px dashed #c9c1ae;text-align:center;color:var(--muted);border-radius:12px}.drawer{position:fixed;inset:0;background:rgba(34,43,49,.17);opacity:0;pointer-events:none;transition:.2s}.drawer.open{opacity:1;pointer-events:auto}.panel{position:absolute;right:0;top:0;height:100%;width:min(460px,92vw);background:#fff;padding:28px;transform:translateX(100%);transition:.22s;box-shadow:-18px 0 44px rgba(34,43,49,.18)}.drawer.open .panel{transform:none}.close{float:right;border:0;background:#eef2f2;border-radius:8px;width:34px;height:34px;font-size:20px;cursor:pointer}.panel .ey{margin-top:38px;color:var(--blue);font-size:12px;font-weight:800}.panel h2{font-size:23px;line-height:1.3;margin:8px 0}.panel p{font-size:14px;color:var(--muted)}.block{border-top:1px solid var(--line);padding:14px 0;font-size:13px}.block b{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.footer{text-align:center;color:var(--muted);font-size:11px;margin:22px 0}@media(max-width:800px){.wrap{padding:16px}.summary{grid-template-columns:repeat(2,1fr)}.action-card{grid-template-columns:1fr}.filters input{margin-left:0;width:100%}.top{align-items:flex-start}.meta{text-align:left}}
</style>
</head>
<body><main class="wrap"><header class="top"><div><div class="kicker">리스크레이더 · 디자인 후보 B · 조치보드</div><h1>대동여주도, 이번 주에 할 일</h1></div><div class="meta">제32주차<br>2026.08.03 – 08.09</div></header><section class="summary"><div class="stat"><label>중점관리</label><b>8</b><strong>우선 확인</strong></div><div class="stat"><label>관찰</label><b>15</b></div><div class="stat"><label>검토 대기</label><b>7</b></div><div class="stat"><label>임박 기한</label><b>0</b><strong>7일 내</strong></div></section><div class="lead"><b>이번 주 핵심</b><span>비밀이야 최종 계약은 핵심 조건 반영 확인 → 날인본과 승인 이력 보관이 다음 행동입니다.</span></div><div class="section-head"><h2>긴급도 순 조치 목록</h2><p>카드를 누르면 상세 근거가 열립니다.</p></div><div class="filters"><button class="filter active" data-filter="all">전체 6</button><button class="filter" data-filter="high">중점관리</button><button class="filter" data-filter="med">관찰</button><button class="filter" data-filter="wait">자료 대기</button><input id="search" placeholder="리스크·조치 검색" aria-label="리스크·조치 검색"></div><section id="list"></section><div class="empty" id="empty">조건에 맞는 조치가 없습니다.</div><div class="footer">변호사-의뢰인 비밀유지 특권 적용 · 외부 공개 금지 · 후보 화면</div></main><div class="drawer" id="drawer"><aside class="panel"><button class="close" id="close">×</button><div class="ey" id="d-level"></div><h2 id="d-title"></h2><p id="d-summary"></p><div class="block"><b>해야 할 일</b><span id="d-action"></span></div><div class="block"><b>기한·상태</b><span id="d-due"></span></div><div class="block"><b>근거</b><span id="d-evidence"></span></div></aside></div><script>
const data=[{id:'r22',level:'high',when:'이번 주',title:'비밀이야 최종 계약 운영기록',summary:'1년·초도 1만 병·상대방 법인정보 반영 확인',action:'날인본·승인 이력 보관',due:'이번 주 확인',evidence:'2026-08-03 최종 계약서·응답자료'},{id:'r23',level:'med',when:'이번 달',title:'청명주 초기 판매 데이터',summary:'7/25 판매 개시, 7월 출고량·채널·매출 취합 예정',action:'판매 데이터 회신 요청',due:'8월 초',evidence:'2026-08-03 판매 개시 회신'},{id:'r004',level:'med',when:'이번 달',title:'분리운영 증빙팩 평가',summary:'5요소 증빙팩의 방어력 등급과 갱신 루틴 설계',action:'평가 회신·분기 루틴 확정',due:'이번 달',evidence:'R-004 증빙팩·평가 요청'},{id:'fu015',level:'med',when:'자료 대기',title:'수원양조 출시 일정·계약서',summary:'출시 일정 조율로 계약 체결 지연',action:'체결 즉시 사본 수령',due:'확정 대기',evidence:'FU-015 후속조치'},{id:'r001',level:'med',when:'분기 내',title:'SLL 로열티 정산',summary:'기존 정산 리스크와 승인 기록을 함께 유지',action:'월별 정산자료 보관',due:'분기 내',evidence:'R-001 리스크 레지스터'},{id:'r21',level:'low',when:'상태 승계',title:'기존 운영 리스크 점검',summary:'전주 확인사항을 승계하며 상태 변화 없음',action:'다음 자료 수령 시 갱신',due:'상태 승계',evidence:'W31 → W32 상태 승계'}];
const list=document.querySelector('#list'),empty=document.querySelector('#empty');let active='all';function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const rows=data.filter(x=>(active==='all'||(active==='wait'?x.id==='fu015':x.level===active))&&(!q||(x.title+x.summary+x.action).toLowerCase().includes(q)));list.innerHTML=rows.map(x=>`<article class="action-card ${x.level}" data-id="${x.id}"><div class="when">${x.level==='high'?'중점관리':x.level==='low'?'경미':'관찰'}<b>${x.when}</b></div><div><h3>${x.title}</h3><p>${x.summary}</p></div><div class="next">${x.action}</div></article>`).join('');empty.style.display=rows.length?'none':'block';list.querySelectorAll('.action-card').forEach(el=>el.onclick=()=>openDrawer(data.find(x=>x.id===el.dataset.id)))}function openDrawer(x){document.querySelector('#d-level').textContent=x.when+' · '+(x.level==='high'?'중점관리':x.level==='low'?'경미':'관찰');document.querySelector('#d-title').textContent=x.title;document.querySelector('#d-summary').textContent=x.summary;document.querySelector('#d-action').textContent=x.action;document.querySelector('#d-due').textContent=x.due;document.querySelector('#d-evidence').textContent=x.evidence;document.querySelector('#drawer').classList.add('open')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelector('#search').oninput=render;document.querySelector('#close').onclick=()=>document.querySelector('#drawer').classList.remove('open');document.querySelector('#drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};render();
</script></body></html>
