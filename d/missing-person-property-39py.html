<!DOCTYPE html><html lang="ko"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<title>실종선고와 행방불명자 재산관리 절차</title>
<style>
  :root{
    --font-serif:'Noto Serif KR','Batang','바탕',Georgia,serif;
    --font-sans:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',-apple-system,'Segoe UI',sans-serif;
    --font-mono:'D2Coding','Consolas','Courier New',monospace;
    --paper:#FAF8F4; --paper-2:#FFF9F5; --ink:#2C2416; --muted:#7A6A55; --soft:#9B8B76;
    --rule:rgba(44,36,22,0.12); --rule-solid:#E8E2D8; --accent:#C4704A;
    --accent-tint:rgba(196,112,74,0.10); --link:#8C6239;
  }
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);}
  .wrap{max-width:1520px;margin:0 auto;padding:32px 24px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--accent);margin:0 0 8px;}
  h1{font-family:var(--font-serif);font-size:28px;font-weight:600;margin:0 0 8px;line-height:1.35;}
  .subtitle{color:var(--muted);font-size:15px;margin:0 0 24px;}
  .diagram-shell{border:1px solid var(--rule);border-radius:8px;overflow-x:auto;background:var(--paper-2);}
  svg{display:block;width:100%;height:auto;}
  .reading-note{font-family:var(--font-serif);font-size:15px;color:var(--muted);margin:16px 0 0;line-height:1.6;}
  .colophon{font-family:var(--font-mono);font-size:12px;color:var(--soft);margin-top:12px;border-top:1px solid var(--rule);padding-top:12px;}
  @media print{
    @page{size:A4 landscape;margin:12mm;}
    html,body{background:#fff;}
    .wrap{max-width:none;padding:0;}
    .diagram-shell{border:1px solid var(--rule-solid);break-inside:avoid;}
  }
</style></head><body>
<div class="wrap">
  <p class="eyebrow">가족상속법 · 실종선고</p>
  <h1>실종선고와 행방불명자 재산관리 절차</h1>
  <p class="subtitle">행방불명 기간에 따른 두 갈래 절차, 그리고 실종선고의 효과와 취소</p>
  <div class="diagram-shell">
    <svg viewBox="0 0 1520 520" xmlns="http://www.w3.org/2000/svg"
         role="img" class="diagram" aria-labelledby="t-missing-person-property d-missing-person-property">
      <title id="t-missing-person-property">실종선고와 행방불명자 재산관리 절차</title>
      <desc id="d-missing-person-property">행방불명 상태에서 실종 기간이 3년 미만이면 재산관리인 선임으로, 보통 5년이나 위난 1년이 지나면 실종선고 청구로 나뉜다. 실종선고가 확정되면 사망으로 간주되어 상속이 개시되고, 생존 사실이 확인되면 실종선고를 취소할 수 있으나 선의의 제3자의 권리는 보호된다는 흐름을 보여주는 상태 도해.</desc>
      <defs>
        <marker id="arrow-mpp" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7A6A55"/></marker>
        <marker id="arrow-accent-mpp" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#C4704A"/></marker>
        <marker id="arrow-link-mpp" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8C6239"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#FAF8F4"/>

      <circle cx="40" cy="184" r="6" fill="#2C2416"/>
      <line x1="46" y1="184" x2="64" y2="184" stroke="#7A6A55" stroke-width="1.2" marker-end="url(#arrow-mpp)"/>

      <line x1="224" y1="184" x2="352" y2="184" stroke="#7A6A55" stroke-width="1.2" marker-end="url(#arrow-mpp)"/>
      <line x1="528" y1="184" x2="640" y2="184" stroke="#C4704A" stroke-width="1.2" marker-end="url(#arrow-accent-mpp)"/>
      <line x1="848" y1="184" x2="960" y2="184" stroke="#7A6A55" stroke-width="1.2" marker-end="url(#arrow-mpp)"/>

      <line x1="1440" y1="184" x2="1472" y2="184" stroke="#7A6A55" stroke-width="1.2" marker-end="url(#arrow-mpp)"/>

      <rect x="242" y="158" width="92" height="16" rx="2" fill="#FAF8F4"/>
      <text x="288" y="170" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">5년·위난 1년</text>

      <rect x="552" y="158" width="64" height="16" rx="2" fill="#FAF8F4"/>
      <text x="584" y="170" fill="#C4704A" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">선고 확정</text>

      <rect x="866" y="158" width="76" height="16" rx="2" fill="#FAF8F4"/>
      <text x="904" y="170" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">생존 확인</text>

      <rect x="1144" y="158" width="96" height="16" rx="2" fill="#FAF8F4"/>
      <text x="1192" y="170" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">선의의 제3자</text>

      <rect x="52" y="272" width="80" height="16" rx="2" fill="#FAF8F4"/>
      <text x="132" y="284" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="end">3년 미만</text>

      <rect x="64" y="140" width="160" height="88" rx="8" fill="#FAF8F4"/>
      <rect x="64" y="140" width="160" height="88" rx="8" fill="#FFFFFF" stroke="#2C2416" stroke-width="1"/>
      <text x="144" y="180" fill="#2C2416" font-size="16" font-weight="600" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif" text-anchor="middle">행방불명</text>
      <text x="144" y="206" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">실종 기간 기산</text>

      <rect x="44" y="332" width="200" height="88" rx="8" fill="#FAF8F4"/>
      <rect x="44" y="332" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#2C2416" stroke-width="1"/>
      <text x="144" y="372" fill="#2C2416" font-size="16" font-weight="600" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif" text-anchor="middle">재산관리인 선임</text>
      <text x="144" y="398" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">민법 제22조~제25조</text>

      <rect x="352" y="140" width="176" height="88" rx="8" fill="#FAF8F4"/>

      <text x="440" y="180" fill="#2C2416" font-size="16" font-weight="600" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif" text-anchor="middle">실종선고 청구</text>
      <text x="440" y="206" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">민법 제27조</text>

      <rect x="640" y="132" width="208" height="104" rx="8" fill="#FAF8F4"/>
      <rect x="640" y="132" width="208" height="104" rx="8" fill="#C4704A" fill-opacity="0.10" stroke="#C4704A" stroke-width="1.2"/>
      <text x="744" y="174" fill="#2C2416" font-size="16" font-weight="600" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif" text-anchor="middle">실종선고 확정</text>
      <text x="744" y="200" fill="#8C6239" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">사망 간주 · 상속 개시</text>

      <rect x="960" y="140" width="176" height="88" rx="8" fill="#FAF8F4"/>
      <rect x="960" y="140" width="176" height="88" rx="8" fill="#FFFFFF" stroke="#2C2416" stroke-width="1"/>
      <text x="1048" y="180" fill="#2C2416" font-size="16" font-weight="600" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif" text-anchor="middle">실종선고 취소</text>
      <text x="1048" y="206" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">민법 제29조</text>

      <rect x="1248" y="140" width="192" height="88" rx="8" fill="#FAF8F4"/>
      <rect x="1248" y="140" width="192" height="88" rx="8" fill="#FFFFFF" stroke="#2C2416" stroke-width="1"/>
      <text x="1344" y="180" fill="#2C2416" font-size="16" font-weight="600" font-family="'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif" text-anchor="middle">선의의 제3자 보호</text>
      <text x="1344" y="206" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" text-anchor="middle">취소 후에도 유지</text>

      <circle cx="1484" cy="184" r="8" fill="none" stroke="#2C2416" stroke-width="1.2"/>
      <circle cx="1484" cy="184" r="4" fill="#2C2416"/>

      <line x1="32" y1="452" x2="1488" y2="452" stroke="rgba(44,36,22,0.12)" stroke-width="0.8"/>
      <text x="32" y="476" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="140" cy="472" r="5" fill="#2C2416"/>
      <text x="154" y="476" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace">시작</text>
      <circle cx="220" cy="472" r="7" fill="none" stroke="#2C2416" stroke-width="1.2"/>
      <circle cx="220" cy="472" r="4" fill="#2C2416"/>
      <text x="234" y="476" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace">종료</text>
      <rect x="300" y="464" width="20" height="16" rx="4" fill="#FFFFFF" stroke="#2C2416" stroke-width="1"/>
      <text x="328" y="476" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace">상태</text>
      <rect x="404" y="464" width="20" height="16" rx="4" fill="#C4704A" fill-opacity="0.10" stroke="#C4704A" stroke-width="1"/>
      <text x="432" y="476" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace">핵심 효과</text>
      <line x1="548" y1="472" x2="584" y2="472" stroke="#7A6A55" stroke-width="1.2" marker-end="url(#arrow-mpp)"/>
      <text x="592" y="476" fill="#7A6A55" font-size="12" font-family="'D2Coding','Consolas','Courier New',monospace">전이 조건</text>
    </svg>
  </div>
  <p class="reading-note">이 도식은 원문 설명 레이어이며 개별 사안의 법률자문을 대체하지 않습니다. 실종선고 기간·재산관리인 요건은 사실관계에 따라 달라질 수 있으므로 구체적 사안은 법률 검토가 필요합니다.</p>
  <footer class="colophon">조우성 변호사</footer>
</div>
</body></html>
