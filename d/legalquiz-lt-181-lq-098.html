<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>외주 제작사가 만든 홍보영상의 저작권을 회사가 갖는다고 말할 수 있나요?</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;color:#1b2530;background:#f4f6f8;line-height:1.6;
  --ink:#1b2530;--muted:#596873;--line:#c9d2d9;--brand:#176b60;--brand-bg:#eef6f4;--ok:#176b60;--ok-bg:#e6f4ef;--bad:#a3322b;--bad-bg:#fbeceb}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:720px;margin:auto;padding:20px 16px 40px}
.card{background:#fff;border:1px solid #dbe1e6;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 10px #1525360a}
h1{font-size:1.3rem;margin:4px 0 8px}
h2{font-size:1.05rem;margin:0 0 10px}
h3{font-size:.98rem;margin:18px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.progress{height:8px;background:#e8edf1;border-radius:10px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:#e8edf1;font-size:.82rem;margin-bottom:8px}
.prompt{font-size:1.02rem;font-weight:650;margin:14px 0 10px}
.panel{background:#f7f9fa;border:1px solid #e2e8ec;border-radius:12px;padding:12px 14px;margin:10px 0}
.panel b{display:block;font-size:.82rem;color:var(--muted);margin-bottom:2px}
.choices{display:grid;gap:10px;margin-top:10px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:420px){.choices.two{grid-template-columns:1fr}}
.choice{font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;text-align:left;cursor:pointer;overflow-wrap:anywhere;width:100%}
.choice:hover:not(:disabled){background:var(--brand-bg);border-color:var(--brand)}
.choice:disabled{cursor:default;color:var(--ink);opacity:1}
.choice.center{text-align:center;font-weight:650}
.choice[aria-pressed="true"]{border-color:#2b4a63;background:#eef3f8}
.choice.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.choice.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.is-error .stmt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--bad)}
.tag{display:inline-block;margin:6px 6px 0 0;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:700;background:#2b4a63;color:#fff}
.is-correct .tag.t-ok,.tag.t-ok{background:var(--ok)}
.tag.t-bad{background:var(--bad)}
.verdict{font-weight:800;font-size:1.05rem;margin:0 0 6px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.feedback{border-left:5px solid var(--brand);background:var(--brand-bg);padding:12px 14px;margin-top:16px;border-radius:6px}
.feedback.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.fix{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--ok-bg);border:1px solid #b9dccf}
.fix b{color:var(--ok)}
.next{font:inherit;font-weight:700;color:#fff;background:var(--brand);border:0;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;margin-top:14px;width:100%}
.next.alt{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0;overflow-wrap:anywhere}
.bubble.them{background:#eef1f4;border-top-left-radius:4px}
.bubble.me{background:#d9ece7;margin-left:auto;border-top-right-radius:4px}
.who{display:block;font-size:.78rem;font-weight:700;color:var(--muted)}
.chip{display:inline-block;background:#fff3d6;border:1px solid #ecd28a;border-radius:99px;padding:4px 12px;font-weight:700}
.rows p{display:flex;gap:8px;margin:6px 0}
.rows .mk{flex:none;width:1.6em;font-weight:800}
.mk.ok{color:var(--ok)}.mk.bad{color:var(--bad)}
.score{font-size:1.5rem;font-weight:800;margin:4px 0 10px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body><main class="wrap">
<header class="card"><h1>외주 제작사가 만든 홍보영상의 저작권을 회사가 갖는다고 말할 수 있나요?</h1><p class="muted">각 문항에 맞음·틀림으로 답한 뒤, 마지막에 확인할 법리와 주의 사항을 살펴보세요.</p>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<p id="counter" class="muted small" aria-live="polite"></p></header>
<section id="stage" class="card"></section>
</main>
<script>
(()=>{'use strict';
const DATA={"model":"statement","items":[{"title":"업무상저작물은 법정 요건을 함께 봅니다","statement":"업무상저작물은 법인 등의 기획 아래 업무에 종사하는 자가 업무상 작성하고, 법인 등의 명의로 공표되며, 계약 등에 다른 정함이 없는 경우 법인 등이 저작자가 된다.","answer":true,"why":"저작권법 제2조 제31호는 법인 등의 기획과 업무 종사자의 업무상 작성을, 제9조는 법인 등 명의 공표와 계약·근무규칙에 다른 정함이 없을 때의 법인 등 저작자 귀속을 정합니다."},{"title":"제작비를 냈다는 이유만으로 저작자가 되지는 않습니다","statement":"회사가 홍보영상 제작을 기획하고 제작비를 지급했다면 다른 사정을 보지 않아도 회사가 업무상저작물의 저작자가 된다.","answer":false,"why":"제2조 제31호와 제9조의 업무상 작성·업무종사성·법인 명의 공표·다른 약정 여부를 함께 살펴야 합니다. 대법원은 프로그램 도급 사건에서도 기획과 비용 부담만으로는 예외적 업무상저작물 요건이 충분하지 않다고 봤습니다. 그 판결은 컴퓨터프로그램 사안입니다."},{"title":"계약의 다른 정함이 있으면 제9조의 기본 귀속이 달라질 수 있습니다","statement":"업무상저작물이 법인 등 명의로 공표되더라도 계약이나 근무규칙 등에 다른 정함이 있으면 제9조의 법인 등 저작자 귀속 규정은 그대로 적용되지 않는다.","answer":true,"why":"저작권법 제9조는 계약 또는 근무규칙 등에 다른 정함이 없는 때에 법인 등을 저작자로 정합니다. 외주 홍보물은 계약에서 저작자 표시와 저작재산권 양도 범위를 확인해야 합니다."},{"title":"외주 결과물은 의뢰 회사에 자동 귀속되지 않습니다","statement":"외주 제작사가 만든 홍보영상은 의뢰 회사가 콘티를 승인하고 대금을 지급했다면 제작사 명의로 공개해도 의뢰 회사가 제9조상 저작자가 된다.","answer":false,"why":"제9조는 법인 등 명의 공표 등 법정 요건을 요구합니다. 프로그램 도급 판결도 주문자의 기획·투자와 주문자 명의 공표 등 매우 예외적인 사정을 따졌으며, 모든 외주 영상에 그대로 적용되는 규칙은 아닙니다."},{"title":"저작재산권은 전부 또는 일부를 양도할 수 있습니다","statement":"저작권법 제45조는 저작재산권의 전부 또는 일부를 양도할 수 있도록 하며, 비프로그램 저작물의 전부 양도에 특약이 없으면 2차적저작물작성권은 포함되지 않은 것으로 추정한다.","answer":true,"why":"제45조 제1항은 전부 또는 일부 양도를 허용하고, 제2항은 특약이 없는 전부 양도에서 2차적저작물작성권은 포함되지 않은 것으로 추정합니다."},{"title":"전부 양도 문구만으로 2차적저작물 권리까지 당연히 포함되지는 않습니다","statement":"홍보영상 저작재산권 전부를 양도한다는 계약은 별도 약정이 없어도 2차적저작물작성권을 포함하는 것으로 추정된다.","answer":false,"why":"홍보영상은 컴퓨터프로그램이 아니므로 제45조 제2항 본문에 따라 특약이 없으면 2차적저작물작성권은 포함되지 않은 것으로 추정됩니다."}],"summary":{"correct_rules":["업무상 작성만으로 충분하지 않고 법인 등의 기획 및 업무 종사성이 필요하며, 법인 등 명의 공표와 계약·근무규칙에 다른 정함이 없는 경우 법인 등이 저작자가 됩니다.","두 판결은 구 프로그램법상 도급 개발을 다뤘습니다. 프로그램 도급에는 업무상저작물 규정이 원칙적으로 적용되지 않지만, 주문자의 전적 기획·투자와 인력 위탁·주문자 명의 공표 등 예외 사정이 있는 경우를 인정할 수 있다고 했습니다. 이 판례를 홍보영상에 직접 적용되는 판결로 표시하지 않습니다.","제9조의 법인 등 저작자 귀속은 계약 또는 근무규칙에 다른 정함이 없는 경우의 기본 규칙입니다.","저작재산권은 전부 또는 일부 양도할 수 있습니다. 비프로그램 저작재산권 전부 양도에 특약이 없으면 2차적저작물작성권은 포함되지 않은 것으로 추정됩니다."],"caution":"일반적인 법률 학습용입니다. 개별 사안의 성립·결과·기간·비용을 판단하거나 보장하지 않습니다. 구체적인 자료와 절차 상태를 별도로 확인하세요."}};
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),counter=document.getElementById('counter');
let at=0,results=[];

const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const MODEL={statement:{name:'진술 판정',prompt:'이 진술은 맞을까요?'}};
const items=DATA.items,N=items.length,M=MODEL[DATA.model];

function progress(){bar.style.width=Math.round(at/N*100)+'%';counter.textContent=at<N?`${at+1} / ${N}`:'완료'}
function start(){at=0;results=[];render()}
function render(){
  progress();stage.replaceChildren();
  const it=items[at];
  stage.append(el('span','badge',`${M.name} · 문항 ${at+1}`));
  stage.append(el('h2','',it.title));
  renderStatement(it);
}

/* ---- 공통: 선택 표시를 유지한 채 정오를 붙인다 (화면을 비우지 않는다) ---- */
function lockChoices(btns,picked,correct,correctTag){
  btns.forEach((b,i)=>{
    b.disabled=true;b.setAttribute('aria-pressed',String(i===picked));
    if(i===correct)b.classList.add('is-correct');
    if(i===picked&&i!==correct)b.classList.add('is-wrong');
    const wrap=el('div');
    if(i===picked)wrap.append(el('span','tag','내 선택'),' ');
    if(i===correct)wrap.append(el('span','tag t-ok',correctTag||'정답'));
    if(wrap.childNodes.length)b.append(wrap);
  });
}
function verdictBox(ok,why,extra){
  const box=el('div','feedback'+(ok?'':' bad'));
  box.setAttribute('role','status');
  box.append(el('p','verdict '+(ok?'ok':'bad'),ok?'✓ 맞아요':'✕ 다시 볼 부분이에요'));
  if(why)box.append(el('p','',why));
  if(extra)box.append(extra);
  const last=at===N-1;
  const nb=el('button','next',last?'결과 보기':'다음 문항');nb.type='button';
  nb.addEventListener('click',()=>{at++;if(at>=N)showResult();else render()});
  stage.append(box,nb);
  nb.focus({preventScroll:false});
  return box;
}
function record(ok){results.push({title:items[at].title,ok})}

/* ---- 진술 판정 ---- */
function renderStatement(it){
  const p=el('div','panel');p.append(el('b','','진술'));p.append(el('p','',it.statement));stage.append(p);
  stage.append(el('p','prompt',M.prompt));
  const box=el('div','choices two');
  const btns=['맞다','틀리다'].map((label,i)=>{const b=el('button','choice center',label);b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{const ans=it.answer?0:1,ok=i===ans;record(ok);lockChoices(btns,i,ans,'정답');verdictBox(ok,it.why)});return b});
  btns.forEach(b=>box.append(b));stage.append(box);
}

/* ---- 종료 요약 ---- */
function showResult(){
  progress();stage.replaceChildren();
  const right=results.filter(r=>r.ok).length;
  stage.append(el('h2','','결과'));
  const sc=el('p','score',`${N}문항 중 ${right}문항 맞음`);sc.setAttribute('role','status');stage.append(sc);
  const rows=el('div','rows');
  results.forEach(r=>{const p=el('p');p.append(el('span','mk '+(r.ok?'ok':'bad'),r.ok?'○':'✕'));p.append(el('span','',r.title+(r.ok?' — 맞음':' — 다시 볼 부분')));rows.append(p)});
  stage.append(rows);
  const rules=DATA.summary.correct_rules||[],caution=DATA.summary.caution||'';
  stage.append(el('h3','','확인된 법리'));rules.forEach(x=>stage.append(el('p','','• '+x)));
  stage.append(el('h3','','주의 사항'));stage.append(el('p','',caution));
  const disclosure='답변은 저장·전송되지 않습니다. 형성학습용 퀴즈이며 개별 사건의 법률 판단이 아닙니다.';
  stage.append(el('p','muted small',disclosure));
  const msg=el('p','small');msg.setAttribute('role','status');
  const copy=el('button','next','결과 복사');copy.type='button';
  copy.addEventListener('click',async()=>{
    try{const rows=results.map(r=>`${r.title} — ${r.ok?'맞음':'다시 볼 부분'}`);await navigator.clipboard.writeText([`${N}문항 중 ${right}문항 맞음`,'',...rows,'','확인된 법리',...rules.map(x=>'• '+x),'','주의 사항',caution,'',disclosure].join('\n'));msg.textContent='결과를 복사했습니다.'}
    catch(_){msg.textContent='이 브라우저에서는 복사할 수 없습니다. 결과를 선택해 복사해 주세요.'}});
  stage.append(copy,msg);
  copy.focus({preventScroll:true});
}
if(N)start();else stage.textContent='문항을 불러오지 못했습니다.';
})();
</script></body></html>
