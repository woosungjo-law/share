<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변제공탁 카툰 — 실제 만화풍</title>
<style>
  :root{
    --ink:#172235; --paper:#f4efe6; --blue:#355f86; --caution:#e4572e;
    --blue2:#2f6fb0; --line:#d9cfbf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 40px;}
  .head{text-align:center;margin-bottom:6px}
  .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--blue);font-weight:700}
  .ttl{font-size:25px;font-weight:900;margin:4px 0 14px;line-height:1.25}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{position:relative;background:#fff;border:3px solid var(--ink);
    border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 rgba(23,34,53,.18)}
  .panel svg{display:block;width:100%;height:auto}
  .no{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:#fff;font-weight:900;font-size:15px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;
    box-shadow:0 0 0 2px var(--ink)}
  .cap{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;
    font-size:11.5px;font-weight:600;padding:6px 10px;line-height:1.3}
  .cap.sit{background:#3a4a63}.cap.pro{background:#a23b1c}
  .cap.fix{background:var(--blue2)}.cap.tip{background:#1f3a5f}
  .note{margin-top:18px;font-size:12px;color:#6b6470;border-top:1px dashed var(--line);
    padding-top:12px;line-height:1.5}
  .bubble{font:700 13px 'Noto Sans KR',sans-serif;fill:var(--ink)}
  .bubble.sm{font-size:11px}
  .sfx{font:900 24px 'Noto Sans KR',sans-serif;fill:var(--caution);
    stroke:#fff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">민사법 · 채무 변제와 법원 공탁</div>
    <div class="ttl">돈은 갚으려 하는데, 상대가 받지 않으면</div>
  </div>

  <div class="grid">

    <!-- 1. 상황 -->
    <div class="panel">
      <div class="no">1</div>
      <svg viewBox="0 0 320 260" role="img" aria-label="갚으려 해도 채권자가 수령을 거절한다">
        <defs><pattern id="ht1" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1.4" fill="#f0d9c8"/></pattern></defs>
        <rect width="320" height="260" fill="url(#ht1)"/>
        <line x1="0" y1="222" x2="320" y2="222" stroke="#d9cfbf" stroke-width="3"/>
        <!-- 채권자(친구, 회색, 손사래) -->
        <g transform="translate(196,0)">
          <path d="M40 222 q-6 -70 28 -78 q34 8 28 78 z" fill="#9aa3ad"/>
          <circle cx="68" cy="104" r="30" fill="#e9e3db"/>
          <path d="M40 100 q4 -34 28 -34 q24 0 28 34 q-12 -16 -28 -14 q-16 -2 -28 14z" fill="#6b7480"/>
          <path d="M54 104 q6 -6 12 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M74 104 q6 -6 12 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M58 122 q12 -7 24 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M30 150 q-14 -22 6 -30" stroke="#9aa3ad" stroke-width="12" fill="none" stroke-linecap="round"/>
        </g>
        <!-- 채무자(이정호, 파랑, 돈 내미는) -->
        <g transform="translate(20,0)">
          <path d="M70 222 q-6 -70 28 -78 q34 8 28 78 z" fill="#355f86"/>
          <circle cx="98" cy="104" r="30" fill="#f2d6c4"/>
          <path d="M70 100 q4 -34 28 -34 q24 0 28 34 q-10 -18 -28 -16 q-18 -2 -28 16z" fill="#3a2c22"/>
          <circle cx="90" cy="104" r="3.4" fill="#172235"/><circle cx="106" cy="104" r="3.4" fill="#172235"/>
          <path d="M88 120 q10 6 20 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M126 150 q26 -10 40 -2" stroke="#355f86" stroke-width="12" fill="none" stroke-linecap="round"/>
          <rect x="160" y="128" width="26" height="18" rx="3" fill="#f4c542" stroke="#172235" stroke-width="2"/>
        </g>
        <!-- 말풍선 -->
        <g>
          <rect x="28" y="22" width="120" height="40" rx="14" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <path d="M70 60 l-8 14 l22 -10 z" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <text x="88" y="46" text-anchor="middle" class="bubble">돈 갚을게!</text>
        </g>
        <g>
          <rect x="196" y="34" width="112" height="40" rx="14" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <path d="M250 72 l8 14 l-22 -10 z" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <text x="252" y="58" text-anchor="middle" class="bubble sm">바빠서 못 받아</text>
        </g>
      </svg>
      <div class="cap sit">갚으려 해도 채권자가 수령을 거절한다</div>
    </div>

    <!-- 2. 문제 -->
    <div class="panel">
      <div class="no">2</div>
      <svg viewBox="0 0 320 260" role="img" aria-label="연체 이자만 눈덩이처럼 쌓인다">
        <defs><pattern id="ht2" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1.4" fill="#f3d6cb"/></pattern></defs>
        <rect width="320" height="260" fill="url(#ht2)"/>
        <line x1="0" y1="222" x2="320" y2="222" stroke="#d9cfbf" stroke-width="3"/>
        <!-- 채무자 alone, worried -->
        <g transform="translate(96,0)">
          <path d="M68 222 q-6 -70 28 -78 q34 8 28 78 z" fill="#355f86"/>
          <circle cx="96" cy="104" r="30" fill="#f2d6c4"/>
          <path d="M68 100 q4 -34 28 -34 q24 0 28 34 q-10 -18 -28 -16 q-18 -2 -28 16z" fill="#3a2c22"/>
          <path d="M84 100 q4 -5 10 -2" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M100 98 q4 -5 10 -2" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="89" cy="112" rx="4" ry="6" fill="#172235"/>
          <ellipse cx="105" cy="112" rx="4" ry="6" fill="#172235"/>
          <path d="M88 124 q8 6 16 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 땀 -->
          <path d="M126 96 q4 8 0 12 q-4 -4 0 -12z" fill="#7fb2e6"/>
        </g>
        <!-- 떠오르는 ₩ 동전 + 위 화살 -->
        <g fill="#f4c542" stroke="#172235" stroke-width="2">
          <circle cx="60" cy="70" r="16"/><circle cx="250" cy="60" r="16"/>
          <circle cx="200" cy="100" r="13"/>
        </g>
        <g fill="#172235" font-weight="900" font-size="16" text-anchor="middle">
          <text x="60" y="75">₩</text><text x="250" y="65">₩</text><text x="200" y="104" font-size="13">₩</text>
        </g>
        <g stroke="#a23b1c" stroke-width="3" fill="none" marker-end="url(#ar)">
          <path d="M70 58 l-4 -16"/><path d="M250 44 l4 -16"/>
        </g>
        <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 z" fill="#a23b1c"/></marker></defs>
        <text x="250" y="34" class="sfx" text-anchor="middle" transform="rotate(-8 250 34)">이자↑</text>
        <!-- 생각말풍선 -->
        <g>
          <ellipse cx="170" cy="170" rx="84" ry="40" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <circle cx="120" cy="210" r="6" fill="#fff" stroke="#172235" stroke-width="2"/>
          <circle cx="108" cy="224" r="4" fill="#fff" stroke="#172235" stroke-width="2"/>
          <text x="170" y="166" text-anchor="middle" class="bubble">빚은 그대로인데…</text>
          <text x="170" y="184" text-anchor="middle" class="bubble sm">이자만 쌓여</text>
        </g>
      </svg>
      <div class="cap pro">채무는 소멸하지 않고 연체 이자만 쌓인다</div>
    </div>

    <!-- 3. 해결 -->
    <div class="panel">
      <div class="no">3</div>
      <svg viewBox="0 0 320 260" role="img" aria-label="법원 공탁소에 맡기면 채무가 소멸한다">
        <defs><pattern id="ht3" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1.4" fill="#d7e6f3"/></pattern></defs>
        <rect width="320" height="260" fill="url(#ht3)"/>
        <!-- 법원 기둥 -->
        <g fill="#cdd8e3" stroke="#9fb1c4" stroke-width="2">
          <rect x="20" y="60" width="14" height="150"/><rect x="60" y="60" width="14" height="150"/>
          <rect x="246" y="60" width="14" height="150"/><rect x="286" y="60" width="14" height="150"/>
        </g>
        <rect x="10" y="48" width="300" height="16" fill="#9fb1c4"/>
        <rect x="6" y="34" width="308" height="14" fill="#b7c6d6"/>
        <!-- 공탁소 창구 -->
        <rect x="96" y="150" width="128" height="72" rx="6" fill="#eef3f8" stroke="#172235" stroke-width="2.5"/>
        <rect x="120" y="176" width="80" height="20" fill="#172235"/>
        <text x="160" y="141" text-anchor="middle" font-size="13" font-weight="900" fill="#172235">공 탁 소</text>
        <!-- 채무자 -->
        <g transform="translate(40,0)">
          <path d="M70 222 q-6 -70 28 -78 q34 8 28 78 z" fill="#355f86"/>
          <circle cx="98" cy="104" r="30" fill="#f2d6c4"/>
          <path d="M70 100 q4 -34 28 -34 q24 0 28 34 q-10 -18 -28 -16 q-18 -2 -28 16z" fill="#3a2c22"/>
          <path d="M88 100 q10 -4 20 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M88 122 q10 8 20 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M126 150 q22 -6 34 6" stroke="#355f86" stroke-width="12" fill="none" stroke-linecap="round"/>
          <rect x="156" y="138" width="24" height="16" rx="3" fill="#f4c542" stroke="#172235" stroke-width="2"/>
        </g>
        <!-- 외침 말풍선(폭발형) -->
        <g>
          <polygon points="150,18 168,30 192,24 182,44 206,52 182,62 194,82 168,74 150,90 140,68 116,74 128,52 108,44 132,34 120,18"
            fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <text x="154" y="52" text-anchor="middle" class="bubble">공탁할게요!</text>
        </g>
        <text x="250" y="120" class="sfx" text-anchor="middle" transform="rotate(10 250 120)">공탁!</text>
      </svg>
      <div class="cap fix">법원 공탁소에 맡기면 채무가 소멸한다 (§466)</div>
    </div>

    <!-- 4. 꿀팁 -->
    <div class="panel">
      <div class="no">4</div>
      <svg viewBox="0 0 320 260" role="img" aria-label="공탁 시 증빙과 금액 확인은 필수">
        <defs><pattern id="ht4" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1.4" fill="#dce6f0"/></pattern></defs>
        <rect width="320" height="260" fill="url(#ht4)"/>
        <rect x="0" y="190" width="320" height="32" fill="#1f3a5f"/>
        <!-- 변호사 -->
        <g transform="translate(30,0)">
          <path d="M70 190 q-6 -64 28 -72 q34 8 28 72 z" fill="#172235"/>
          <circle cx="98" cy="100" r="30" fill="#f2d6c4"/>
          <path d="M70 96 q4 -32 28 -32 q24 0 28 32 q-10 -16 -28 -14 q-18 -2 -28 14z" fill="#2c2218"/>
          <path d="M86 100 q10 -3 20 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M86 120 q12 5 24 0" stroke="#172235" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 넥타이 -->
          <path d="M98 132 l-6 14 l6 10 l6 -10 z" fill="#e4572e"/>
        </g>
        <!-- 책상 + 체크리스트 -->
        <rect x="170" y="120" width="120" height="64" rx="6" fill="#fff" stroke="#172235" stroke-width="2.5"/>
        <g stroke="#172235" stroke-width="2.5" fill="none">
          <rect x="182" y="132" width="14" height="14" rx="3"/><path d="M184 139 l4 4 l7 -8"/>
          <rect x="182" y="154" width="14" height="14" rx="3"/><path d="M184 161 l4 4 l7 -8"/>
        </g>
        <g font-size="11" font-weight="700" fill="#172235">
          <text x="206" y="143">금액 확인</text><text x="206" y="165">증빙 보관</text>
        </g>
        <!-- OK 도장 -->
        <g transform="translate(250,70) rotate(-14)">
          <circle r="22" fill="none" stroke="#e4572e" stroke-width="4"/>
          <text x="0" y="7" text-anchor="middle" font-size="16" font-weight="900" fill="#e4572e">OK</text>
        </g>
        <!-- 말풍선 -->
        <g>
          <rect x="20" y="20" width="200" height="56" rx="14" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <path d="M60 74 l-6 16 l22 -10 z" fill="#fff" stroke="#172235" stroke-width="2.5"/>
          <text x="120" y="42" text-anchor="middle" class="bubble sm">받지 않아도 공탁이면 끝!</text>
          <text x="120" y="62" text-anchor="middle" class="bubble sm">단, 증빙·금액 확인 필수</text>
        </g>
      </svg>
      <div class="cap tip">공탁이 확실한 해결 — 단, 증빙·금액 확인 필수</div>
    </div>

  </div>

  <div class="note">
    이 카툰은 원문 설명 레이어이며, 개별 사안의 법률자문을 대체하지 않습니다.
    사건별 공탁 요건·절차는 관할 법원 공탁소 안내를 확인하세요.
  </div>
</div>
</body>
</html>
