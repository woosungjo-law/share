<script>
"use strict";
var D = JSON.parse(document.getElementById("sc-data").textContent);
var GRADE = {high:"가능성 높음", mid:"살펴볼 것", check:"확인 필요"};
var screenEl = document.getElementById("screen");
var pathStack = [];          // [{qid, qtext, label}]

function h(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function clearScreen(){ while(screenEl.firstChild) screenEl.removeChild(screenEl.firstChild); screenEl.className = "screen active"; window.scrollTo(0,0); }

function setProgress(step, done){
  var bar = document.getElementById("progress-bar");
  var lab = document.getElementById("progress-label");
  if(done){ bar.style.width = "100%"; lab.textContent = "진단 완료"; return; }
  if(step === 0){ bar.style.width = "0%"; lab.textContent = ""; return; }
  bar.style.width = Math.min(100, Math.round(step / D.nq_max * 100)) + "%";
  lab.textContent = "질문 " + step;
}

function showIntro(){
  pathStack = []; clearScreen(); setProgress(0);
  var wrap = h("div","intro");
  wrap.appendChild(h("div","intro-icon", D.icon || "⚖️"));
  wrap.appendChild(h("h1","", D.hook));
  if(D.myth){
    var m = h("div","myth"); m.appendChild(h("b","","많은 분들이 이렇게 알고 있어요")); m.appendChild(document.createTextNode("“" + D.myth + "”"));
    wrap.appendChild(m);
  }
  if(D.teaser) wrap.appendChild(h("p","", D.teaser));
  var meta = h("div","meta");
  [D.time || "약 1분", "객관식 질문 최대 " + D.nq_max + "개", "답변은 저장·전송되지 않아요"].forEach(function(t){ meta.appendChild(h("span","",t)); });
  wrap.appendChild(meta);
  var b = h("button","opt-btn primary","진단 시작하기"); b.type = "button";
  b.onclick = function(){ goTo(D.start); };
  wrap.appendChild(b);
  screenEl.appendChild(wrap);
}

function goTo(id){
  if(D.outcomes[id]) return showOutcome(id);
  showQuestion(id);
}

function showQuestion(qid){
  var q = D.questions[qid];
  clearScreen();
  var step = pathStack.length + 1;
  setProgress(step);
  screenEl.appendChild(h("div","q-count","질문 " + step));
  screenEl.appendChild(h("div","q-text", q.text));
  if(q.why) screenEl.appendChild(h("div","q-why", q.why));
  var box = h("div","options");
  q.options.forEach(function(o){
    var b = h("button","opt-btn", o.label); b.type = "button";
    b.onclick = function(){ pathStack.push({qid:qid, qtext:q.text, label:o.label}); goTo(o.next); };
    box.appendChild(b);
  });
  screenEl.appendChild(box);
  var back = h("button","back-btn", pathStack.length ? "← 이전 질문으로" : "← 처음으로"); back.type = "button";
  back.onclick = function(){
    if(!pathStack.length) return showIntro();
    var last = pathStack.pop(); showQuestion(last.qid);
  };
  screenEl.appendChild(back);
}

function copyText(text, btn){
  function ok(){ var o = btn.textContent; btn.textContent = "복사했어요 ✓"; setTimeout(function(){ btn.textContent = o; }, 1800); }
  function fallback(){
    var t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ btn.textContent = "복사 실패 — 직접 선택해 주세요"; }
    document.body.removeChild(t);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); } else { fallback(); }
}

function block(label, bodyNode){
  var b = h("div","block"); b.appendChild(h("div","block-label",label)); b.appendChild(bodyNode); return b;
}

function cleanOne(s){ return String(s || "").replace(/\s+/g," ").trim(); }
function shortLegal(s){
  var x = cleanOne(s);

}

}

  var summary = cleanOne(o.share_summary) ? o.share_summary : fallbackShare(o);
  return [
    "[법률 자가진단] " + cleanOne(D.hook),
    "내 답변: " + (answers || "기록 없음"),
    "결과: " + GRADE[o.grade] + " — " + cleanOne(o.title),
    summary,
    "법적 근거: " + shortLegal(o.basis),
    "※ " + cleanOne(o.disclaimer || D.disclaimer),
    "진단 링크: " + location.href
  ].join("\n");
}

function showOutcome(oid){
  var o = D.outcomes[oid];
  clearScreen(); setProgress(0, true);
  var head = h("div");
  var g = h("span","grade " + o.grade, "● " + GRADE[o.grade]);
  head.appendChild(g);
  if(o.tag) head.appendChild(h("span","outcome-tag", o.tag));
  screenEl.appendChild(head);
  var wrap = h("div","outcome");
  wrap.appendChild(h("h2","", o.title));

  /* 왜 이 결과인가 — 내가 고른 답 + 근거 1줄 */
  var why = h("div");
  var chips = h("div","chips");
  pathStack.forEach(function(p){ chips.appendChild(h("div","chip","· " + p.label)); });
  why.appendChild(chips);
  why.appendChild(h("div","why-line", o.why));
  wrap.appendChild(block("🔎 왜 이 결과인가요?", why));

  if(o.share_summary || o.why || o.caution){
    wrap.appendChild(block("🧾 한눈에 정리", h("div","share-summary", o.share_summary || fallbackShare(o))));
  }

  if(o.fact && D.myth){
    var vs = h("div","vs");
    var m = h("div","m"); m.appendChild(h("b","","통념")); m.appendChild(document.createTextNode(D.myth));
    var f = h("div","f"); f.appendChild(h("b","","이 경우엔")); f.appendChild(document.createTextNode(o.fact));
    vs.appendChild(m); vs.appendChild(f);
    wrap.appendChild(block("💡 통념 vs 사실", vs));
  }
  if(o.checklist && o.checklist.length){
    var ul = h("ul","checklist"); o.checklist.forEach(function(c){ ul.appendChild(h("li","",c)); });
    wrap.appendChild(block("✅ 지금 해볼 것", ul));
  }
  wrap.appendChild(block("⚠️ 주의할 점", h("div","block-body", o.caution)));
  var bd = document.createElement("details"); bd.className = "basis-details";
  bd.appendChild(h("summary","","📖 법적 근거 보기"));
  bd.appendChild(h("div","block-body", o.basis));
  wrap.appendChild(bd);
  wrap.appendChild(h("div","disclaimer", o.disclaimer || D.disclaimer));
  screenEl.appendChild(wrap);

  var actions = h("div","actions");
  var cp = h("button","ghost-btn","📋 결과 요약 복사하기"); cp.type = "button";
  cp.onclick = function(){
    var t = copySummaryText(o);
    copyText(t, cp);
  };
  actions.appendChild(cp);
  if(D.mother_url){
    var a = h("a","ghost-btn","📰 원문 컬럼 읽어보기"); a.href = D.mother_url; a.target = "_blank"; a.rel = "noopener"; actions.appendChild(a);
  }
  var rs = h("button","ghost-btn","↺ 처음부터 다시"); rs.type = "button"; rs.onclick = showIntro;
  actions.appendChild(rs);
  screenEl.appendChild(actions);

  var cta = h("div","cta-box");
  cta.appendChild(document.createTextNode((o.cta || "지금 상황을 구체적으로 확인하고 싶다면") + " "));
  var s = h("strong","", D.cta_lawyer);
  cta.appendChild(s);
  cta.appendChild(document.createTextNode("("));
  var ml = h("a","", D.cta_email); ml.href = "mailto:" + D.cta_email; cta.appendChild(ml);
  cta.appendChild(document.createTextNode(")에게 문의하세요."));
  screenEl.appendChild(cta);
}

document.getElementById("footer").textContent = "제공 : " + D.cta_lawyer + " 법률사무소";
showIntro();
</script>
</body>
</html>
