<style>
  :root{
    --navy:#12233f; --navy-deep:#0a1626; --accent:#c9a24b; --bg:#f4f5f7; --card:#ffffff;
    --text:#1e232b; --muted:#5f6673; --line:#e5e7eb;
    --g-high:#1f7a4d; --g-mid:#b7791f; --g-check:#4a5568;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;padding:16px;line-height:1.55;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  .app{width:100%;max-width:480px;background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(18,35,63,.12);overflow:hidden;display:flex;flex-direction:column;min-height:560px;}
  .topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .topbar .brand{font-weight:700;letter-spacing:.02em;}
  .progress-wrap{height:4px;background:var(--line);width:100%;}
  .progress-bar{height:100%;background:var(--accent);width:0%;transition:width .25s ease;}
  .screen{flex:1;padding:26px 22px 22px;display:none;flex-direction:column;animation:fadeIn .22s ease;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .intro-icon{font-size:38px;margin-bottom:12px;}
  .intro h1{font-size:22px;line-height:1.4;color:var(--navy-deep);margin-bottom:12px;}
  .myth{background:#fbf6ea;border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:#4a3d16;}
  .myth b{display:block;font-size:11px;letter-spacing:.04em;color:#8a6d1f;margin-bottom:3px;}
  .intro p{color:var(--muted);font-size:14px;margin-bottom:16px;}
  .meta{font-size:12px;color:var(--muted);margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;}
  .meta span{background:var(--bg);padding:4px 10px;border-radius:20px;}

  .q-count{font-size:12px;color:#8a6d1f;font-weight:700;margin-bottom:8px;letter-spacing:.03em;}
  .q-text{font-size:19px;font-weight:700;color:var(--navy-deep);margin-bottom:8px;line-height:1.45;}
  .q-why{font-size:12.5px;color:var(--muted);margin-bottom:18px;}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .opt-btn{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;font-size:14.5px;color:var(--text);cursor:pointer;transition:all .15s ease;min-height:44px;width:100%;}
  .opt-btn:hover,.opt-btn:active,.opt-btn:focus-visible{border-color:var(--accent);background:#fbf6ea;outline:none;}
  .opt-btn.primary{text-align:center;font-weight:700;background:var(--navy);color:#fff;border:none;}
  .opt-btn.primary:hover,.opt-btn.primary:focus-visible{background:var(--navy-deep);}
  .back-btn{margin-top:14px;background:none;border:none;color:var(--muted);font-size:12.5px;text-align:left;cursor:pointer;min-height:36px;text-decoration:underline;}

  .grade{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;padding:5px 12px;border-radius:20px;margin-bottom:10px;width:fit-content;}
  .grade.high{background:var(--g-high);} .grade.mid{background:var(--g-mid);} .grade.check{background:var(--g-check);}
  .outcome-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:#eef1f6;padding:4px 10px;border-radius:20px;margin-bottom:10px;margin-left:6px;}
  .outcome h2{font-size:18px;color:var(--navy-deep);margin-bottom:14px;line-height:1.5;}
  .block{margin-bottom:15px;}
  .block-label{font-size:12px;font-weight:700;color:#8a6d1f;margin-bottom:5px;letter-spacing:.02em;}
  .block-body{font-size:13.5px;color:var(--text);}
  .chips{display:flex;flex-direction:column;gap:5px;margin-bottom:6px;}
  .chip{font-size:12.5px;background:var(--bg);border-radius:8px;padding:6px 10px;color:#3b4250;}
  .why-line{font-size:13.5px;}
  .vs{display:grid;gap:6px;}
  .vs div{font-size:13px;border-radius:8px;padding:9px 12px;}
  .vs .m{background:#f6ecec;color:#7a2f2f;} .vs .f{background:#e9f4ee;color:#1d5b3a;}
  .vs b{display:block;font-size:10.5px;letter-spacing:.05em;margin-bottom:2px;}
  .checklist{list-style:none;display:flex;flex-direction:column;gap:6px;}
  .checklist li{font-size:13.5px;padding-left:22px;position:relative;}
  .checklist li::before{content:"☐";position:absolute;left:0;color:#8a6d1f;}
  .disclaimer{font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .actions{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .ghost-btn{background:transparent;border:1.5px solid var(--line);color:#3b4250;border-radius:10px;padding:11px;font:inherit;font-size:13px;cursor:pointer;min-height:44px;text-align:center;text-decoration:none;display:block;}
  .ghost-btn:hover,.ghost-btn:focus-visible{border-color:var(--accent);outline:none;}
  .cta-box{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px;font-size:13.5px;margin-top:auto;}
  .cta-box strong{color:var(--accent);} .cta-box a{color:#fff;text-decoration:underline;}
  .footer-mark{text-align:center;font-size:11px;color:var(--muted);padding:10px 0 16px;}
  @media (max-width:380px){ .screen{padding:22px 16px 18px;} .q-text{font-size:18px;} }
</style>
</head>

": "check", "tag": "나온 경위 확인", "title": "어떻게 나왔고 절차가 어땠는지부터 볼 상황이에요.", "why": "나온 경위나 절차를 확인하지 못했어요.", "fact": "스스로 나가는 것과 제명, 당연 탈퇴는 각각 다른 경우라고 마더는 설명합니다.", "basis": "제24조는 탈퇴·당연탈퇴를, 제25조는 제명 절차(10일 전 통지·의견진술)를 정합니다.", "caution": "내 경우가 어디인지 먼저 가리세요.", "checklist": ["정관의 탈퇴·제명 사유를 복사하세요.", "통지 날짜·총회 날짜를 모으세요."], "disclaimer": "", "cta": ""}, "D": {"grade": "mid", "tag": "빚 주장 검증", "title": "조합의 빚 주장을 따져볼 상황이에요.", "why": "조합이 빚을 이유로 미룬다고 답했어요.", "fact": "빚이 실제로 있는지와 범위, 갚을 시기를 나누어 보라고 마더는 설명합니다.", "basis": "제26조 제4항은 빚을 다 갚기 전에는 환급을 정지할 수 있고, 제27조는 손실액 부담을 정합니다.", "caution": "두 다툼(결의·환급)의 기한을 나눠 관리하세요.", "checklist": ["빚의 내역을 요구해 검증하세요.", "지분액과의 관계를 정리하세요."], "disclaimer": "", "cta": ""}, "E": {"grade": "check", "tag": "기한 목록 확인", "title": "지킬 기한 목록부터 잡아야 하는 상황이에요.", "why": "무엇을 해야 할지 모르겠다고 답했어요.", "fact": "통지와 회의록, 장부를 모아 기한을 지키라고 마더는 설명합니다.", "basis": "제24조부터 제27조까지를 순서대로 적어보며 내 위치를 찾습니다.", "caution": "시효가 다가오면 청구 기록을 먼저 남기세요.", "checklist": ["통지·회의록·납입 내역을 모으세요.", "2년 시효 시작점을 표시하세요."], "disclaimer": "", "cta": ""}}}</script>
<script>
"use strict";
var D = JSON.parse(document.getElementById("sc-data").textContent);
var GRADE = {high:"가능성 높음", mid:"살펴볼 것", check:"확인 필요"};
var screenEl = document.getElementById("screen");
var pathStack = [];          // [{qid, qtext, label}]

function h(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function clearScreen(){ while(screenEl.firstChild) screenEl.removeChild(screenEl.firstChild); screenEl.className = "screen active"; window.scrollTo(0,0); }

function setProgress(step, done){
  var bar = document.getElementById("progress-bar");
  var lab = document.getElementById("progress-label");
  if(done){ bar.style.width = "100%"; lab.textContent = "진단 완료"; return; }
  if(step === 0){ bar.style.width = "0%"; lab.textContent = ""; return; }
  bar.style.width = Math.min(100, Math.round(step / D.nq_max * 100)) + "%";
  lab.textContent = "질문 " + step;
}

function showIntro(){
  pathStack = []; clearScreen(); setProgress(0);
  var wrap = h("div","intro");
  wrap.appendChild(h("div","intro-icon", D.icon || "⚖️"));
  wrap.appendChild(h("h1","", D.hook));
  if(D.myth){
    var m = h("div","myth"); m.appendChild(h("b","","많은 분들이 이렇게 알고 있어요")); m.appendChild(document.createTextNode("“" + D.myth + "”"));
    wrap.appendChild(m);
  }
  if(D.teaser) wrap.appendChild(h("p","", D.teaser));
  var meta = h("div","meta");
  [D.time || "약 1분", "객관식 질문 최대 " + D.nq_max + "개", "답변은 저장·전송되지 않아요"].forEach(function(t){ meta.appendChild(h("span","",t)); });
  wrap.appendChild(meta);
  var b = h("button","opt-btn primary","진단 시작하기"); b.type = "button";
  b.onclick = function(){ goTo(D.start); };
  wrap.appendChild(b);
  screenEl.appendChild(wrap);
}

function goTo(id){
  if(D.outcomes[id]) return showOutcome(id);
  showQuestion(id);
}

function showQuestion(qid){
  var q = D.questions[qid];
  clearScreen();
  var step = pathStack.length + 1;
  setProgress(step);
  screenEl.appendChild(h("div","q-count","질문 " + step));
  screenEl.appendChild(h("div","q-text", q.text));
  if(q.why) screenEl.appendChild(h("div","q-why", q.why));
  var box = h("div","options");
  q.options.forEach(function(o){
    var b = h("button","opt-btn", o.label); b.type = "button";
    b.onclick = function(){ pathStack.push({qid:qid, qtext:q.text, label:o.label}); goTo(o.next); };
    box.appendChild(b);
  });
  screenEl.appendChild(box);
  var back = h("button","back-btn", pathStack.length ? "← 이전 질문으로" : "← 처음으로"); back.type = "button";
  back.onclick = function(){
    if(!pathStack.length) return showIntro();
    var last = pathStack.pop(); showQuestion(last.qid);
  };
  screenEl.appendChild(back);
}

function copyText(text, btn){
  function ok(){ var o = btn.textContent; btn.textContent = "복사했어요 ✓"; setTimeout(function(){ btn.textContent = o; }, 1800); }
  function fallback(){
    var t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ btn.textContent = "복사 실패 — 직접 선택해 주세요"; }
    document.body.removeChild(t);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); } else { fallback(); }
}

function block(label, bodyNode){
  var b = h("div","block"); b.appendChild(h("div","block-label",label)); b.appendChild(bodyNode); return b;
}

function showOutcome(oid){
  var o = D.outcomes[oid];
  clearScreen(); setProgress(0, true);
  var head = h("div");
  var g = h("span","grade " + o.grade, "● " + GRADE[o.grade]);
  head.appendChild(g);
  if(o.tag) head.appendChild(h("span","outcome-tag", o.tag));
  screenEl.appendChild(head);
  var wrap = h("div","outcome");
  wrap.appendChild(h("h2","", o.title));

  /* 왜 이 결과인가 — 내가 고른 답 + 근거 1줄 */
  var why = h("div");
  var chips = h("div","chips");
  pathStack.forEach(function(p){ chips.appendChild(h("div","chip","· " + p.label)); });
  why.appendChild(chips);
  why.appendChild(h("div","why-line", o.why));
  wrap.appendChild(block("🔎 왜 이 결과인가요?", why));

  if(o.fact && D.myth){
    var vs = h("div","vs");
    var m = h("div","m"); m.appendChild(h("b","","통념")); m.appendChild(document.createTextNode(D.myth));
    var f = h("div","f"); f.appendChild(h("b","","이 경우엔")); f.appendChild(document.createTextNode(o.fact));
    vs.appendChild(m); vs.appendChild(f);
    wrap.appendChild(block("💡 통념 vs 사실", vs));
  }
  wrap.appendChild(block("📖 법적 근거", h("div","block-body", o.basis)));
  if(o.checklist && o.checklist.length){
    var ul = h("ul","checklist"); o.checklist.forEach(function(c){ ul.appendChild(h("li","",c)); });
    wrap.appendChild(block("✅ 지금 해볼 것", ul));
  }
  wrap.appendChild(block("⚠️ 주의할 점", h("div","block-body", o.caution)));
  wrap.appendChild(h("div","disclaimer", o.disclaimer || D.disclaimer));
  screenEl.appendChild(wrap);

  var actions = h("div","actions");
  var cp = h("button","ghost-btn","📋 결과 요약 복사하기"); cp.type = "button";
  cp.onclick = function(){
    var t = "[법률 자가진단] " + D.hook + "\n결과: " + GRADE[o.grade] + " — " + o.title + "\n※ 일반적인 법률 정보이며 개별 사안은 상담이 필요합니다.\n" + location.href;
    copyText(t, cp);
  };
  actions.appendChild(cp);
  if(D.mother_url){
    var a = h("a","ghost-btn","📰 원문 컬럼 읽어보기"); a.href = D.mother_url; a.target = "_blank"; a.rel = "noopener"; actions.appendChild(a);
  }
  var rs = h("button","ghost-btn","↺ 처음부터 다시"); rs.type = "button"; rs.onclick = showIntro;
  actions.appendChild(rs);
  screenEl.appendChild(actions);

  var cta = h("div","cta-box");
  cta.appendChild(document.createTextNode((o.cta || "지금 상황을 구체적으로 확인하고 싶다면") + " "));
  var s = h("strong","", D.cta_lawyer);
  cta.appendChild(s);
  cta.appendChild(document.createTextNode("("));
  var ml = h("a","", D.cta_email); ml.href = "mailto:" + D.cta_email; cta.appendChild(ml);
  cta.appendChild(document.createTextNode(")에게 문의하세요."));
  screenEl.appendChild(cta);
}
