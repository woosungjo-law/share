<style>
:root{--ink:#172235;--paper:#f4efe6;--blue:#355f86;--caution:#e4572e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 40px}
.head{text-align:center;margin-bottom:14px}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--blue);font-weight:700}
.ttl{font-size:25px;font-weight:900;margin:4px 0 0;line-height:1.25}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{position:relative;background:#fff;border:3px solid var(--ink);border-radius:12px;
 overflow:hidden;box-shadow:3px 3px 0 rgba(23,34,53,.18);aspect-ratio:512/400}
.art{display:block;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;pointer-events:none}
.no{position:absolute;top:8px;left:8px;z-index:3;width:30px;height:30px;border-radius:50%;
 background:var(--ink);color:#fff;font-weight:900;font-size:15px;display:flex;
 align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.bub{position:absolute;max-width:62%;font:700 13px/1.3 'Noto Sans KR',sans-serif;
 color:var(--ink);background:#fff;border:2.5px solid var(--ink);padding:7px 10px;border-radius:14px;
 pointer-events:none}
.bub.p-bl{left:10px;bottom:64px}
.bub.p-tr{right:10px;top:44px}
.b-thought{border-radius:18px;background:#fff;font-style:italic}
.b-shout{background:#fff;border-color:var(--caution);color:var(--caution);
 font-weight:900;border-radius:8px;transform:rotate(-2deg);box-shadow:0 0 0 2px #fff}
.b-shout::after{content:"";position:absolute;inset:-5px;border:2px solid var(--caution);
 border-radius:12px;transform:rotate(3deg);z-index:-1}
.sfx{position:absolute;font:900 24px 'Noto Sans KR',sans-serif;color:var(--caution);
 -webkit-text-stroke:4px #fff;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.sfx.tr{right:14px;top:18px}.sfx.br{right:14px;bottom:70px}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;font-size:11.5px;
 font-weight:600;padding:6px 10px;line-height:1.3;background:var(--ink)}
.cap.sit{background:#3a4a63}.cap.pro{background:#a23b1c}.cap.fix{background:#2f6fb0}.cap.tip{background:#1f3a5f}
.note{margin-top:18px;font-size:12px;color:#6b6470;border-top:1px dashed #d9cfbf;
 padding-top:12px;line-height:1.5}
</style></head><body>
