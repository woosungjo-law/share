:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b2530;background:#f4f6f8;line-height:1.55}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:20px 16px 36px}.card{background:white;border:1px solid #dbe1e6;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 10px #1525360a}h1{font-size:1.35rem;margin:4px 0 12px}h2{font-size:1.05rem;margin:0 0 12px}.muted{color:#596873}.progress{height:8px;background:#e8edf1;border-radius:10px;overflow:hidden}.progress>i{display:block;height:100%;background:#176b60;width:0;transition:width .2s}.prompt{font-size:1.05rem;margin:12px 0}.choices{display:grid;gap:10px;min-width:0}.choices button,.action{font:inherit;color:inherit;background:#fff;border:1px solid #9eabb5;border-radius:12px;padding:12px 14px;min-height:48px;text-align:left;cursor:pointer}.choices button{width:100%;min-width:0;overflow-wrap:anywhere}.choices button:hover,.action:hover{background:#f0f6f4;border-color:#176b60}.feedback{border-left:4px solid #176b60;background:#f0f6f4;padding:12px;margin-top:14px;border-radius:6px}.action{background:#176b60;color:white;border:0;text-align:center;font-weight:650}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions .action{flex:1}.small{font-size:.9rem}.result{white-space:pre-wrap}.badge{display:inline-block;padding:2px 8px;border-radius:99px;background:#e8edf1;font-size:.82rem}

<body><main class="wrap"><header class="card"><h1>지급명령, 신청 전 확인할 절차와 갈림길</h1><p class="muted">가상의 거래 사례에서 신청 대상, 이의 기간, 소송 전환과 확정 효력을 차례로 살펴봅니다.</p><div class="progress" aria-label="진행 상황"><i id="bar"></i></div><p id="counter" class="muted small" aria-live="polite"></p></header><section id="stage" class="card" aria-live="polite"></section></main>
<script>
(()=>{'use strict';
const DATA={"activities":[{"title":"신청 대상과 송달 가능성","stem":"(가상 상황) 회사가 국내 거래처에 미지급 물품대금 지급을 청구하려 합니다. 지급명령 신청을 검토할 때 맞는 설명은 무엇인가요?","options":[{"text":"금전 등 일정 수량의 지급 청구이고 국내에서 공시송달 외 방법으로 송달할 수 있다면 신청할 수 있다.","react":""},{"text":"금전 청구라면 상대방에게 공시송달만 가능해도 지급명령을 신청할 수 있다.","react":""}],"answer":0,"why":"민사소송법 제462조는 금전·대체물·유가증권의 일정 수량 지급 청구를 대상으로 하며, 국내에서 공시송달 외 방법으로 송달할 수 있어야 합니다.","context":"","kind":"choice","retake":{"stem":"가상의 채권자가 거래대금 지급을 구합니다. 채무자에게 국내에서 일반 송달이 가능하다면 지급명령 대상인지 무엇을 기준으로 판단하나요?","options":[{"text":"금전 청구이면 송달 방법과 관계없이 신청할 수 있다.","react":""},{"text":"금전 등 일정 수량의 지급 청구인지와 공시송달 외 송달이 가능한지를 확인한다.","react":""}],"answer":1},"issues":["지급명령 신청 대상","청구자료 연결"]},{"title":"채무자 심문 여부","stem":"지급명령은 신청 전에 채무자를 법원이 반드시 심문해야 발령할 수 있나요?","options":[{"text":"예. 채무자가 먼저 답변한 뒤에만 발령할 수 있습니다.","react":""},{"text":"아니요. 지급명령은 채무자를 심문하지 않고 합니다.","react":""}],"answer":1,"why":"민사소송법 제467조는 지급명령을 채무자를 심문하지 않고 한다고 정합니다.","context":"","kind":"choice","retake":{"stem":"법원이 지급명령을 내리기 전 채무자의 출석 심문을 거쳐야 하나요?","options":[{"text":"채무자가 출석해 진술해야 지급명령이 가능합니다.","react":""},{"text":"채무자를 심문하지 않고 지급명령을 합니다.","react":""}],"answer":1},"issues":["채무자 사전 심문"]},{"title":"이의신청 기간과 범위","stem":"채무자가 지급명령을 송달받은 뒤 2주 안에 청구 일부에 적법하게 이의했습니다. 그 효력에 관한 설명은 무엇인가요?","options":[{"text":"이의가 접수되면 언제나 청구 전부가 자동으로 확정됩니다.","react":""},{"text":"이의한 범위에서 지급명령의 효력이 없어집니다.","react":""}],"answer":1,"why":"민사소송법 제470조에 따르면 송달받은 날부터 2주 이내의 이의신청은 그 범위에서 지급명령의 효력을 잃게 합니다.","context":"","kind":"choice","retake":{"stem":"지급명령을 받은 채무자가 2주 안에 청구액 중 일부에 이의했습니다. 법률상 바로 달라지는 것은 무엇인가요?","options":[{"text":"이의한 범위에서 지급명령이 효력을 잃습니다.","react":""},{"text":"청구 전부가 채권자 승소로 확정됩니다.","react":""}],"answer":0},"issues":["2주 이의와 효력 범위"]},{"title":"적법한 이의 뒤의 절차","stem":"(가상 상황) 채무자가 지급명령을 송달받은 날부터 2주 안에 청구 일부에 적법하게 이의했습니다. 이의된 부분의 소송 절차에 관한 설명은 무엇인가요?","options":[{"text":"이의된 청구목적의 값에 관해 지급명령 신청 시 소가 제기된 것으로 봅니다.","react":""},{"text":"채권자는 이의된 부분에서 자동으로 승소합니다.","react":""}],"answer":0,"why":"민사소송법 제472조는 적법한 이의신청이 있는 경우 이의된 청구목적의 값에 관해 지급명령을 신청한 때 소가 제기된 것으로 봅니다. 이는 승소나 회수 완료를 뜻하지 않습니다.","context":"","kind":"choice","retake":{"stem":"채무자의 적법한 이의로 지급명령 절차가 이어지지 않게 됐습니다. 이의된 청구 부분은 어떤 절차상 취급을 받나요?","options":[{"text":"지급명령 신청 시 소가 제기된 것으로 봅니다.","react":""},{"text":"이의만으로 채권자가 청구액을 회수한 것으로 봅니다.","react":""}],"answer":0},"issues":["이의 뒤 소송 전환"]},{"title":"지급명령의 확정 효력","stem":"이의신청이 없거나, 이의신청이 취하되거나, 이의신청 각하결정이 확정된 경우 지급명령의 효력은 무엇인가요?","options":[{"text":"확정판결과 같은 효력이 있습니다.","react":""},{"text":"채무가 실제로 모두 변제된 것으로 간주됩니다.","react":""}],"answer":0,"why":"민사소송법 제474조의 요건이 갖춰지면 지급명령은 확정판결과 같은 효력을 가집니다. 실제 회수나 집행 완료를 보장하는 뜻은 아닙니다.","context":"","kind":"choice","retake":{"stem":"채무자의 이의신청이 없거나, 취하되거나, 각하결정이 확정되면 지급명령은 어떤 효력을 갖나요?","options":[{"text":"채권자가 돈을 실제로 받은 것으로 처리됩니다.","react":""},{"text":"확정판결과 같은 효력을 갖습니다.","react":""}],"answer":1},"issues":["지급명령의 확정 효력"]},{"title":"신청 전 무엇을 먼저 확인할까","stem":"지급명령 신청을 검토하는 실무자가 준비 순서를 정한다면, 어느 접근이 더 설득력 있다고 생각하나요?","options":[{"text":"자료와 예상 항변을 먼저 대조한다","react":""},{"text":"신청을 준비하면서 송달·이의 관리도 함께 설계한다","react":""},{"text":"잘 모르겠다","react":""}],"answer":0,"why":"이 문항은 정답을 매기지 않는 견해 선택입니다. 자료 준비와 송달·기한 관리는 서로 대체하지 않으며 실제 사정에 맞춰 함께 살펴야 합니다.","context":"","kind":"opinion","views":[{"label":"자료 점검을 먼저","text":"청구 원인·금액과 계약·거래·검수·변제자료를 연결하고 예상 항변을 살핀 뒤 신청 여부를 검토한다."},{"label":"절차 관리도 함께","text":"신청 자료를 준비하는 동시에 송달일·이의기간·담당자 기록을 설계해 다음 절차가 끊기지 않게 한다."}],"issues":["청구자료 연결","예상 항변 점검"]}],"summary":{"correct_rules":["금전·대체물·유가증권의 일정 수량 지급 청구에 대해 국내에서 공시송달 외 방법으로 송달할 수 있는 경우 지급명령을 신청할 수 있습니다.","지급명령은 채무자를 심문하지 않고 합니다. 송달 뒤의 이의신청 기회는 별도 절차입니다.","청구 원인·금액을 계약·거래·검수·변제자료와 연결해 보는 것은 신청 전 실무 점검입니다. 이를 독립된 법정 신청요건이나 회수 보장으로 표현하지 않습니다.","하자·계약불일치·상계·변제 가능성과 반박자료를 검토하는 것은 실무 준비입니다. 예상 항변만으로 신청 적합성이나 절차 결과가 확정되지는 않습니다.","채무자가 지급명령을 송달받은 날부터 2주 이내 이의신청하면 지급명령은 이의한 범위에서 효력을 잃습니다. 해당 기간은 불변기간입니다.","적법한 이의가 있으면 이의된 청구목적의 값에 관해 지급명령 신청 시 소가 제기된 것으로 봅니다. 이 절차상 간주는 승소나 실제 회수 완료를 뜻하지 않습니다.","이의가 없거나 취하되거나 각하결정이 확정된 경우 지급명령은 확정판결과 같은 효력을 가집니다. 실제 변제나 집행 완료와는 구분합니다."],"caution":"일반적인 절차 학습용입니다. 개별 청구의 성립·지급명령 신청 적합성·송달 여부·이의 가능성·실제 회수나 집행 결과를 판단하거나 보장하지 않습니다. 구체적 자료와 절차 상태를 별도로 확인하세요."}};
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),counter=document.getElementById('counter');
let at=0, first=[], retakes=[], followups=[], active=null, copied=false;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function progress(){bar.style.width=(DATA.activities.length?Math.round(at/DATA.activities.length*100):0)+'%';counter.textContent=`${Math.min(at+1,DATA.activities.length)} / ${DATA.activities.length}`}
function button(label,fn,cls=''){const b=el('button','action '+cls,label);b.type='button';b.addEventListener('click',fn);return b}
function renderQuestion(retry=false){const a=DATA.activities[at];active=retry?{...a,stem:a.retake.stem,options:a.retake.options,answer:a.retake.answer}:a;stage.replaceChildren();stage.append(el('span','badge',retry?'한 번 더':'문항'));stage.append(el('h2','',active.title));if(active.context)stage.append(el('p','muted',active.context));stage.append(el('p','prompt',active.stem));const opts=el('div','choices');active.options.forEach((o,i)=>{const b=el('button','',o.text);b.type='button';b.addEventListener('click',()=>answer(i,retry));opts.append(b)});const unsure=el('button','small muted','잘 모르겠어요');unsure.type='button';unsure.addEventListener('click',()=>answer(-1,retry));opts.append(unsure);stage.append(opts);progress()}
function askConfidence(entry,continueFlow){stage.replaceChildren();stage.append(el('h2','','첫 응답 확신도 (선택)'));stage.append(el('p','muted','한 번 눌러 기록하거나 건너뛸 수 있습니다. 재도전으로 바뀌지 않습니다.'));[['확실','sure'],['긴가민가','unsure'],['건너뛰기',null]].forEach(([label,value])=>stage.append(button(label,()=>{entry.confidence=value;continueFlow()})));}
function answer(index,retry){const a=active,correct=index<0?null:index===a.answer,entry={activity:at,choice:index,correct,dont_know:index<0,round:retry?'retake':'first'};if(!retry&&a.options[index]?.level!==undefined)entry.level=index<0?null:a.options[index].level;if(retry){retakes.push(entry);showFeedback(a,index,correct,true,entry);return}first.push(entry);askConfidence(entry,()=>showFeedback(a,index,correct,false,entry))}
function renderRecall(){const a=DATA.activities[at];active=a;stage.replaceChildren();stage.append(el('span','badge','회상 자기보고'));stage.append(el('h2','',a.title));stage.append(el('p','prompt',a.stem));stage.append(button('떠올림',()=>renderConfirmation(a,'remembered')));stage.append(button('힌트',()=>renderHint(a)));stage.append(button('모르겠다',()=>renderConfirmation(a,'dont_know')));progress()}
function renderHint(a){stage.replaceChildren();stage.append(el('span','badge','회상 자기보고'));stage.append(el('h2','',a.title));stage.append(el('p','muted','힌트'));stage.append(el('p','feedback',a.hint));stage.append(button('확인 선택지 보기',()=>renderConfirmation(a,'hint')));progress()}
function renderConfirmation(a,signal){active=a;stage.replaceChildren();stage.append(el('span','badge','정답 확인'));stage.append(el('h2','',a.title));stage.append(el('p','prompt','떠올린 내용을 확인해 보세요.'));const opts=el('div','choices');a.options.forEach((o,i)=>{const b=el('button','',o.text);b.type='button';b.addEventListener('click',()=>finishConfirmation(a,signal,i));opts.append(b)});const unsure=el('button','small muted','모르겠다');unsure.type='button';unsure.addEventListener('click',()=>finishConfirmation(a,signal,-1));opts.append(unsure);stage.append(opts);progress()}
function finishConfirmation(a,signal,index){const correct=index<0?null:index===a.answer,confirmation=index<0?'dont_know':correct?'correct':'wrong';const prefix={remembered:'recalled',hint:'hint',dont_know:'dont_know_signal'}[signal];let classification;if(signal==='dont_know')classification='dont_know_self_report';else if(signal==='remembered')classification=correct===true?'recalled_correct':'recalled_not_correct';else classification=correct===true?'hint_correct':'hint_not_correct';const entry={activity:at,choice:index,correct,dont_know:index<0,round:'first',recall_signal:signal,confirmation_result:confirmation,classification};first.push(entry);askConfidence(entry,()=>showFeedback(a,index,correct,false,entry))}
function showFeedback(a,index,correct,retry,entry){stage.replaceChildren();if(a.kind==='recall')stage.append(el('span','badge',entry?.recall_signal==='dont_know'?'회상 자기보고':'정답 확인'));if(!retry&&index>=0&&a.options[index]?.misconception)stage.append(el('span','badge','오답 보기(오해)'));stage.append(el('h2','',correct?'좋아요':'다시 살펴볼 부분이 있어요'));const msg=index<0?'답을 고르지 않고 넘어가기로 했습니다.':(a.options[index]?.react||'');if(msg)stage.append(el('p','feedback',msg));if(a.why)stage.append(el('p','',a.why));if(!retry&&!correct&&a.followup){stage.append(el('p','prompt',a.followup.stem));const opts=el('div','choices');a.followup.options.forEach(o=>{const b=el('button','',o.text);b.type='button';b.addEventListener('click',()=>{opts.querySelectorAll('button').forEach(x=>x.disabled=true);followups.push({activity:at,correct:o.correct});stage.append(el('p','feedback',o.correct?'잘 짚었습니다.':'이 부분을 다시 확인해 보세요.'));appendNextChoices(a,index,correct,retry)});opts.append(b)});stage.append(opts);return}appendNextChoices(a,index,correct,retry)}
function appendNextChoices(a,index,correct,retry){if(!retry&&!correct&&a.retake){stage.append(el('p','muted small','첫 응답은 유지됩니다. 바꿔 쓴 문항에 한 번 더 답할 수 있습니다.'));stage.append(button('한 번 더 풀기',()=>renderQuestion(true)));}stage.append(button('다음으로',next))}
function renderGray(){const a=DATA.activities[at];stage.replaceChildren();stage.append(el('span','badge','점수에 반영되지 않는 견해 선택'));stage.append(el('h2','',a.title));stage.append(el('p','prompt',a.stem));(a.views||[]).forEach(v=>{const block=el('div','feedback');block.append(el('strong','',v.label));block.append(el('p','',v.text));stage.append(block)});(a.options||[]).forEach((o,i)=>stage.append(button(o.text,()=>{const entry={activity:at,choice:i,correct:null,opinion:true,round:'first'};first.push(entry);askConfidence(entry,()=>{stage.replaceChildren(el('p','feedback',a.why||'의견을 확인했습니다.'));stage.append(button('다음으로',next))})})));progress()}
function next(){at++;if(at>=DATA.activities.length)return result();const a=DATA.activities[at];if(a.kind==='opinion')renderGray();else if(a.kind==='recall')renderRecall();else renderQuestion(false)}
function responsePattern(row,a){if(a.kind==='opinion')return '견해 선택 (정오 없음)';const confidence=row.confidence==='sure'?'확실':row.confidence==='unsure'?'긴가민가':'확신 미표시';if(row.dont_know||row.correct===null){const label=a.response_labels?.dont_know||'몰랐음·모르겠다';return `${label} · ${confidence}`}if(a.options.some(o=>o.level!==undefined)){const label=row.level===2?'정확한 이해':row.level===1?'부분 이해':'오해 보기 선택';return `${label} · ${confidence}`}if(row.confidence===null||row.confidence===undefined){const label=row.correct?(a.response_labels?.correct||'맞음'):(a.response_labels?.wrong||'틀림');return `${label}(확신 미표시)`}if(row.correct&&row.confidence==='sure')return a.response_labels?.correct||'알고 있음';if(row.correct)return a.response_labels?'알아챔 · 긴가민가':'불안한 정답';if(row.confidence==='sure')return a.response_labels?'혼동 · 확실':'확신했지만 달랐음';return a.response_labels?'혼동 · 긴가민가':'몰랐음·모르겠다'}
function result(){
 bar.style.width='100%';counter.textContent='완료';
 const recoveredRetakes=new Set(retakes.filter(x=>x.correct).map(x=>x.activity)),recoveredFollowups=new Set(followups.filter(x=>x.correct).map(x=>x.activity)),states=new Map();
 const rank={'첫 답에서 확인':1,'재도전에서 확인':2,'후속 질문에서 보완':2,'추가 확인 권장':3};
 for(const row of first){const activity=DATA.activities[row.activity];if(activity.kind==='opinion')continue;let state;if(row.correct===true)state='첫 답에서 확인';else if(recoveredRetakes.has(row.activity))state='재도전에서 확인';else if(recoveredFollowups.has(row.activity))state='후속 질문에서 보완';else state='추가 확인 권장';for(const label of activity.issues||[]){if(!states.has(label)||rank[state]>rank[states.get(label)])states.set(label,state)}}
 const pattern=states.size?[...states].map(([label,state])=>`${label}: ${state}`):['기록할 쟁점 상태가 없습니다.'];
 const responseRows=first.map(x=>`${DATA.activities[x.activity].title}: ${responsePattern(x,DATA.activities[x.activity])}`);
 const recallLabels={recalled_correct:'떠올림 후 정답',recalled_not_correct:'떠올림 후 오답/모름',hint_correct:'힌트 후 정답',hint_not_correct:'힌트 후 오답/모름',dont_know_self_report:'처음부터 모르겠다 자기보고'};
 const confirmationLabels={correct:'정답',wrong:'오답',dont_know:'모르겠다'};
 const recallPaths=first.filter(x=>DATA.activities[x.activity].kind==='recall').map(x=>`${DATA.activities[x.activity].title}: ${recallLabels[x.classification]||'회상 경로'} · 정답 확인: ${confirmationLabels[x.confirmation_result]||'확인 전'}`);
 const rules=DATA.summary.correct_rules||[],caution=DATA.summary.caution||'';
 stage.replaceChildren(el('h2','','응답 패턴 및 쟁점 상태'));pattern.forEach(x=>stage.append(el('p','',x)));
 stage.append(el('h2','','최초 응답 패턴'));responseRows.forEach(x=>stage.append(el('p','',x)));
 if(recallPaths.length){stage.append(el('h2','','회상 자기보고와 정답 확인'));recallPaths.forEach(x=>stage.append(el('p','',x)))}
 stage.append(el('h2','','확인된 법리'));rules.forEach(x=>stage.append(el('p','',x)));
 stage.append(el('h2','','주의 사항'));stage.append(el('p','',caution));stage.append(el('p','muted small','개별 답변은 저장되지 않습니다.'));
 stage.append(button('결과 복사',async()=>{try{const copyLines=['쟁점 상태',...pattern,'','확인된 법리',...rules.map(x=>'• '+x),'','주의 사항',caution];await navigator.clipboard.writeText(copyLines.join('\n'));copied=true;stage.append(el('p','feedback','결과를 복사했습니다.'))}catch(_){stage.append(el('p','feedback','이 브라우저에서는 복사할 수 없습니다. 결과를 선택해 복사해 주세요.'))}}));
 stage.append(button('처음부터',()=>{at=0;first=[];retakes=[];followups=[];copied=false;const a=DATA.activities[0];a.kind==='opinion'?renderGray():a.kind==='recall'?renderRecall():renderQuestion(false)}));
}
if(DATA.activities.length){const a=DATA.activities[0];a.kind==='opinion'?renderGray():a.kind==='recall'?renderRecall():renderQuestion(false)}else stage.textContent='문항을 불러오지 못했습니다.';
})();
</script></body></html>
